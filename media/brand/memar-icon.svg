<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- MEMAR app icon: AR glasses whose right lens shows a memory card, with a glowing reminder badge. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13224A"/>
      <stop offset="0.55" stop-color="#0A1330"/>
      <stop offset="1" stop-color="#050A1A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.74" cy="0.34" r="0.62">
      <stop offset="0" stop-color="#32D6FF" stop-opacity="0.42"/>
      <stop offset="0.45" stop-color="#2E7BFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#2E7BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#B9CCEB"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6FE6FF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2E7BFF" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="dot" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#8CF5FF"/>
      <stop offset="0.5" stop-color="#3CCBFF"/>
      <stop offset="1" stop-color="#2F6BFF"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7DEBFF"/>
      <stop offset="1" stop-color="#3D8BFF"/>
    </linearGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <clipPath id="rightLens">
      <rect x="548" y="455" width="300" height="230" rx="104"/>
    </clipPath>
  </defs>

  <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="232" fill="url(#glow)"/>
  <rect x="6" y="6" width="1012" height="1012" rx="226" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="4"/>

  <!-- lens glass -->
  <rect x="176" y="455" width="300" height="230" rx="104" fill="url(#lens)"/>
  <rect x="548" y="455" width="300" height="230" rx="104" fill="url(#lens)"/>

  <!-- reflection streak on the left lens -->
  <path d="M232 640 L330 488 L372 488 L274 640 Z" fill="#FFFFFF" fill-opacity="0.10"/>

  <!-- memory card seen through the right lens -->
  <g clip-path="url(#rightLens)">
    <rect x="606" y="532" width="150" height="26" rx="13" fill="#FFFFFF" fill-opacity="0.92"/>
    <rect x="606" y="580" width="104" height="22" rx="11" fill="url(#bar)" fill-opacity="0.9"/>
  </g>

  <!-- frame -->
  <g fill="none" stroke="url(#frame)" stroke-linecap="round" stroke-linejoin="round">
    <rect x="176" y="455" width="300" height="230" rx="104" stroke-width="40"/>
    <rect x="548" y="455" width="300" height="230" rx="104" stroke-width="40"/>
    <path d="M478 522 Q512 486 546 522" stroke-width="34"/>
    <path d="M160 510 L104 486" stroke-width="34"/>
    <path d="M864 510 L920 486" stroke-width="34"/>
  </g>

  <!-- reminder badge with pulse rings -->
  <circle cx="842" cy="438" r="186" fill="none" stroke="#5CE1FF" stroke-opacity="0.10" stroke-width="8"/>
  <circle cx="842" cy="438" r="138" fill="none" stroke="#5CE1FF" stroke-opacity="0.22" stroke-width="9"/>
  <circle cx="842" cy="438" r="100" fill="#3CCBFF" fill-opacity="0.55" filter="url(#blur)"/>
  <circle cx="842" cy="438" r="104" fill="#0B1533"/>
  <circle cx="842" cy="438" r="80" fill="url(#dot)"/>
  <ellipse cx="818" cy="408" rx="34" ry="20" fill="#FFFFFF" fill-opacity="0.45" transform="rotate(-28 818 408)"/>
</svg>
