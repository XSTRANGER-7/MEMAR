<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" width="1500" height="1000">
  <!-- MEMAR Devpost thumbnail (3:2). Uses local fonts Bahnschrift / Segoe UI. -->
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101D42"/>
      <stop offset="0.6" stop-color="#081028"/>
      <stop offset="1" stop-color="#040816"/>
    </linearGradient>
    <radialGradient id="tglow" cx="0.28" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#32D6FF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#32D6FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8CF5FF"/>
      <stop offset="1" stop-color="#3D7BFF"/>
    </linearGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0 L0 0 0 50" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1500" height="1000" fill="url(#tbg)"/>
  <rect width="1500" height="1000" fill="url(#grid)"/>
  <rect width="1500" height="1000" fill="url(#tglow)"/>

  <image href="memar-icon.svg" x="80" y="270" width="460" height="460"/>

  <g font-family="Bahnschrift, 'Segoe UI', sans-serif">
    <text x="606" y="520" font-size="196" font-weight="700" letter-spacing="10" fill="#FFFFFF">MEM<tspan fill="url(#ar)">AR</tspan></text>
    <text x="612" y="604" font-family="'Segoe UI', sans-serif" font-size="50" font-weight="600" fill="#DCE7FA">Reminders that live on your things.</text>
    <text x="612" y="668" font-family="'Segoe UI', sans-serif" font-size="36" fill="#8FA3C8">A memory layer for AR glasses</text>
  </g>

  <g font-family="'Segoe UI', sans-serif" font-size="28" font-weight="600">
    <rect x="612" y="716" width="246" height="58" rx="29" fill="#5CE1FF" fill-opacity="0.12" stroke="#5CE1FF" stroke-opacity="0.5" stroke-width="2"/>
    <text x="735" y="755" text-anchor="middle" fill="#9FEFFF">Look · Pinch · Say</text>
    <rect x="874" y="716" width="270" height="58" rx="29" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="2"/>
    <text x="1009" y="755" text-anchor="middle" fill="#DCE7FA">Lens for Spectacles</text>
  </g>
</svg>
