# Publishes the MEMAR web simulator (web-sim/) to GitHub Pages, so anyone can try MEMAR from a link,
# on a phone or a laptop, without glasses or Lens Studio.
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy web simulator to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["web-sim/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-sim
      - id: deployment
        uses: actions/deploy-pages@v4
